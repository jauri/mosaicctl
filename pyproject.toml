[project]
name = "mosaicctl"
version = "0.1.0"
description = "Configure an NVIDIA Mosaic display wall with frame lock from a layout file"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mosaicctl = "mosaicctl.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mosaicctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
